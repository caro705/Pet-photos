
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Pet Photos Upload</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      background: #f4f6fa;
      font-family: Arial, sans-serif;
      color: #222;
    }

    .card {
      max-width: 480px;
      margin: 35px auto;
      padding: 30px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 6px 25px rgba(0,0,0,.08);
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 18px;
      font-weight: bold;
    }

    input[type="text"],
    input[type="file"] {
      width: 100%;
      padding: 13px;
      margin-top: 8px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
    }

    input:focus {
      outline: 2px solid #2563eb;
      outline-offset: 2px;
    }

    #preview {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 20px;
    }

    #preview img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 8px;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover:not(:disabled) {
      background: #1d4ed8;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    #status {
      margin-top: 18px;
      text-align: center;
      font-size: 14px;
      overflow-wrap: anywhere;
      white-space: pre-line;
    }

    .success {
      color: #16803c;
    }

    .error {
      color: #dc2626;
    }

    .info {
      color: #2563eb;
    }

    progress {
      width: 100%;
      height: 15px;
      margin-top: 15px;
      display: none;
    }

    .footer {
      text-align: center;
      margin-top: 20px;
      color: #888;
      font-size: 12px;
    }

    @media (max-width: 500px) {
      body {
        padding: 12px;
      }

      .card {
        margin: 15px auto;
        padding: 22px;
      }
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>🐾 Pet Photos</h1>

    <p class="subtitle">
      Share your favorite pet pictures with us!
    </p>

    <!-- YOUR NAME -->

    <label for="name">Your name</label>

    <input
      id="name"
      type="text"
      placeholder="Enter your name"
      maxlength="60"
      autocomplete="name"
    >

    <!-- PET NAME -->

    <label for="petName">Your pet's name</label>

    <input
      id="petName"
      type="text"
      placeholder="Enter your pet's name"
      maxlength="60"
    >

    <!-- PICTURES -->

    <label for="photos">Choose pictures</label>

    <input
      id="photos"
      type="file"
      accept="image/*"
      multiple
    >

    <!-- PREVIEW -->

    <div id="preview"></div>

    <!-- UPLOAD BUTTON -->

    <button id="upload" type="button">
      📤 Upload Pictures
    </button>

    <!-- PROGRESS -->

    <progress
      id="progress"
      max="100"
      value="0"
    ></progress>

    <!-- STATUS -->

    <div
      id="status"
      role="status"
      aria-live="polite"
    ></div>

    <div class="footer">
      Your pictures are uploaded securely.
    </div>

  </div>

  <script>

    // =====================================================
    // SUPABASE SETTINGS
    // =====================================================

    const SUPABASE_URL =
      "https://epznvuilyfkccmehywkv.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_1s4sNZCewdc9z78Koxc42g_GIc_kM1c";

    const BUCKET_NAME = "photos";

    const MAX_FILE_SIZE = 20 * 1024 * 1024;

    // =====================================================
    // ELEMENTS
    // =====================================================

    const nameInput =
      document.getElementById("name");

    const petNameInput =
      document.getElementById("petName");

    const photos =
      document.getElementById("photos");

    const preview =
      document.getElementById("preview");

    const status =
      document.getElementById("status");

    const button =
      document.getElementById("upload");

    const progress =
      document.getElementById("progress");

    // =====================================================
    // VARIABLES
    // =====================================================

    let db = null;

    let uploading = false;

    let previewUrls = [];

    // =====================================================
    // STATUS MESSAGE
    // =====================================================

    function showStatus(message, type = "info") {

      status.textContent = message;

      status.className = type;

    }

    // =====================================================
    // INITIALIZE SUPABASE
    // =====================================================

    try {

      if (!window.supabase) {

        throw new Error(
          "Supabase library did not load. Check your internet connection."
        );

      }

      if (
        !SUPABASE_URL ||
        !SUPABASE_KEY ||
        SUPABASE_KEY === "YOUR_SUPABASE_PUBLISHABLE_KEY"
      ) {

        throw new Error(
          "Please configure your Supabase URL and publishable key."
        );

      }

      db = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

      showStatus(
        "Ready to upload your pet pictures.",
        "info"
      );

    } catch (error) {

      showStatus(
        error.message,
        "error"
      );

      button.disabled = true;

    }

    // =====================================================
    // CLEAN UP PREVIEW URLS
    // =====================================================

    function clearPreviewUrls() {

      for (const url of previewUrls) {

        URL.revokeObjectURL(url);

      }

      previewUrls = [];

    }

    // =====================================================
    // IMAGE PREVIEWS
    // =====================================================

    photos.addEventListener("change", () => {

      // Remove old previews

      clearPreviewUrls();

      preview.innerHTML = "";

      const files = Array.from(photos.files);

      let validImages = 0;

      for (const file of files) {

        if (!file.type.startsWith("image/")) {

          continue;

        }

        const img = document.createElement("img");

        const url = URL.createObjectURL(file);

        previewUrls.push(url);

        img.src = url;

        img.alt = "Selected pet picture";

        preview.appendChild(img);

        validImages++;

      }

      // Show selection status

      if (files.length === 0) {

        showStatus(
          "No pictures selected.",
          "info"
        );

      } else {

        showStatus(
          validImages +
          " picture(s) selected.",
          "info"
        );

      }

    });

    // =====================================================
    // UPLOAD BUTTON
    // =====================================================

    button.addEventListener(
      "click",
      uploadPhotos
    );

    // =====================================================
    // UPLOAD PICTURES
    // =====================================================

    async function uploadPhotos() {

      // Prevent simultaneous uploads

      if (uploading) {

        return;

      }

      // Check Supabase

      if (!db) {

        showStatus(
          "Supabase connection is not configured.",
          "error"
        );

        return;

      }

      // Get selected files

      const files = Array.from(
        photos.files
      );

      // Check files

      if (files.length === 0) {

        showStatus(
          "Please select at least one picture.",
          "error"
        );

        return;

      }

      // Validate selected files before uploading

      const invalidFiles = [];

      for (const file of files) {

        if (!file.type.startsWith("image/")) {

          invalidFiles.push(
            file.name + ": Not an image."
          );

        }

        else if (file.size > MAX_FILE_SIZE) {

          invalidFiles.push(
            file.name + ": File exceeds 20 MB."
          );

        }

        else if (file.size === 0) {

          invalidFiles.push(
            file.name + ": File is empty."
          );

        }

      }

      if (invalidFiles.length > 0) {

        showStatus(
          "Please correct the following:\n\n" +
          invalidFiles.join("\n"),
          "error"
        );

        return;

      }

      // Get names

      const uploaderName =
        nameInput.value.trim() || "Anonymous";

      const petName =
        petNameInput.value.trim() || "Unknown";

      // Start upload

      uploading = true;

      button.disabled = true;

      progress.style.display = "block";

      progress.value = 0;

      showStatus(
        "Starting upload...",
        "info"
      );

      // Results

      let success = 0;

      let failed = 0;

      const errors = [];

      // ===================================================
      // UPLOAD EACH PICTURE
      // ===================================================

      for (let i = 0; i < files.length; i++) {

        const file = files[i];

        showStatus(
          "Uploading picture " +
          (i + 1) +
          " of " +
          files.length +
          "...\n\n" +
          "File: " +
          file.name,
          "info"
        );

        // Safe file extension

        const originalExtension =
          file.name
            .split(".")
            .pop()
            .toLowerCase()
            .replace(/[^a-z0-9]/g, "");

        const safeExtension =
          /^[a-z0-9]{1,10}$/.test(
            originalExtension
          )
            ? originalExtension
            : "jpg";

        // Unique filename

        const filename =
          crypto.randomUUID() +
          "." +
          safeExtension;

        // Storage path

        const path =
          "uploads/" +
          filename;

        try {

          // ===============================================
          // UPLOAD IMAGE TO SUPABASE STORAGE
          // ===============================================

          const {
            error: uploadError
          } = await db.storage
            .from(BUCKET_NAME)
            .upload(
              path,
              file,
              {
                contentType: file.type,
                upsert: false
              }
            );

          if (uploadError) {

            throw new Error(
              "Storage upload failed: " +
              uploadError.message
            );

          }

          // ===============================================
          // SAVE IMAGE DETAILS TO DATABASE
          // ===============================================

          const {
            error: databaseError
          } = await db
            .from("photo_uploads")
            .insert({

              file_path: path,

              original_filename: file.name,

              uploader_name: uploaderName,

              pet_name: petName

            });

          if (databaseError) {

            console.error(
              "Database error:",
              databaseError
            );

            throw new Error(
              "Image uploaded, but uploader details could not be saved: " +
              databaseError.message
            );

          }

          // ===============================================
          // SUCCESS
          // ===============================================

          success++;

        } catch (error) {

          // ===============================================
          // ERROR
          // ===============================================

          failed++;

          const message =
            error.message ||
            String(error);

          errors.push(
            file.name +
            ": " +
            message
          );

          console.error(
            "Upload failed:",
            error
          );

        }

        // ===============================================
        // UPDATE PROGRESS
        // ===============================================

        progress.value =
          Math.round(
            ((i + 1) / files.length) * 100
          );

      }

      // ===================================================
      // FINISHED
      // ===================================================

      uploading = false;

      button.disabled = false;

      // ===================================================
      // ALL SUCCESSFUL
      // ===================================================

      if (failed === 0) {

        showStatus(
          "✅ Success!\n\n" +
          success +
          " picture(s) uploaded successfully.",
          "success"
        );

        // Clear selected files

        photos.value = "";

        // Remove previews

        clearPreviewUrls();

        preview.innerHTML = "";

        // Reset progress

        progress.value = 100;

      }

      // ===================================================
      // SOME FAILED
      // ===================================================

      else {

        showStatus(
          "Upload finished.\n\n" +
          "Uploaded: " +
          success +
          "\n" +
          "Failed: " +
          failed +
          "\n\n" +
          "Error details:\n" +
          errors.join("\n"),
          "error"
        );

      }

    }

  </script>

</body>
</html>
