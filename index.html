
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>Pet Photos Upload</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      background: #f4f6fa;
      font-family: Arial, sans-serif;
      color: #222;
    }

    .card {
      max-width: 480px;
      margin: 35px auto;
      padding: 30px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 6px 25px rgba(0,0,0,.08);
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin-top: 18px;
      font-weight: bold;
    }

    input[type="text"],
    input[type="file"] {
      width: 100%;
      padding: 13px;
      margin-top: 8px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
    }

    #preview {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 20px;
    }

    #preview img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 8px;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    #status {
      margin-top: 18px;
      text-align: center;
      font-size: 14px;
      overflow-wrap: anywhere;
      white-space: pre-line;
    }

    .success { color: #16803c; }
    .error { color: #dc2626; }
    .info { color: #2563eb; }

    progress {
      width: 100%;
      height: 15px;
      margin-top: 15px;
      display: none;
    }

    .footer {
      text-align: center;
      margin-top: 20px;
      color: #888;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>🐾 Pet Photos</h1>

    <p class="subtitle">
      Share your favorite pet pictures with us!
    </p>

    <label for="name">Your name (optional)</label>
    <input
      id="name"
      type="text"
      placeholder="Enter your name"
      maxlength="60"
    >

    <label for="photos">Choose pictures</label>
    <input
      id="photos"
      type="file"
      accept="image/*"
      multiple
    >

    <div id="preview"></div>

    <button id="upload" type="button">
      📤 Upload Pictures
    </button>

    <progress id="progress" max="100" value="0"></progress>

    <div id="status" role="status" aria-live="polite"></div>

    <div class="footer">
      Your pictures are uploaded securely.
    </div>

  </div>

  <script>
    // SUPABASE SETTINGS
    // Replace the key with your actual publishable key.
    // Never use a secret or service_role key here.

    const SUPABASE_URL =
      "https://epznvuilyfkccmehywkv.supabase.co/rest/v1/";

    const SUPABASE_KEY =
      "sb_publishable_1s4sNZCewdc9z78Koxc42g_GIc_kM1c"
    const photos = document.getElementById("photos");
    const preview = document.getElementById("preview");
    const status = document.getElementById("status");
    const button = document.getElementById("upload");
    const progress = document.getElementById("progress");

    let db = null;

    function showStatus(message, type = "info") {
      status.textContent = message;
      status.className = type;
    }

    try {
      if (!window.supabase) {
        throw new Error("Supabase library did not load.");
      }

      if (SUPABASE_KEY ===
          "sb_publishable_1s4sNZCewdc9z78Koxc42g_GIc_kM1c"
          throw new Error(
          "Please add your Supabase publishable key."
        );
      }

      db = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

    } catch (error) {
      showStatus(error.message, "error");
      button.disabled = true;
    }

    // IMAGE PREVIEWS
    photos.addEventListener("change", () => {
      preview.innerHTML = "";

      const files = Array.from(photos.files);

      for (const file of files) {
        if (!file.type.startsWith("image/")) {
          continue;
        }

        const img = document.createElement("img");
        const url = URL.createObjectURL(file);

        img.src = url;
        img.alt = "Selected photo";

        img.onload = () => URL.revokeObjectURL(url);
        img.onerror = () => URL.revokeObjectURL(url);

        preview.appendChild(img);
      }

      if (files.length > 0) {
        showStatus(
          files.length + " picture(s) selected.",
          "info"
        );
      }
    });

    // UPLOAD PICTURES
    button.addEventListener("click", uploadPhotos);

    async function uploadPhotos() {
      if (!db) {
        showStatus(
          "Supabase connection is not configured.",
          "error"
        );
        return;
      }

      const files = Array.from(photos.files);

      if (files.length === 0) {
        showStatus(
          "Please select at least one picture.",
          "error"
        );
        return;
      }

      button.disabled = true;
      progress.style.display = "block";
      progress.value = 0;

      let success = 0;
      let failed = 0;
      const errors = [];

      for (let i = 0; i < files.length; i++) {
        const file = files[i];

        if (!file.type.startsWith("image/")) {
          failed++;
          errors.push(file.name + ": Not an image.");
          continue;
        }

        if (file.size > 20 * 1024 * 1024) {
          failed++;
          errors.push(
            file.name + ": File exceeds 20 MB."
          );
          continue;
        }

        showStatus(
          "Uploading picture " +
          (i + 1) + " of " + files.length + "...",
          "info"
        );

        const extension = file.name
          .split(".")
          .pop()
          .toLowerCase()
          .replace(/[^a-z0-9]/g, "");

        const safeExtension =
          /^[a-z0-9]{1,10}$/.test(extension)
          ? extension
          : "jpg";

        const filename =
          crypto.randomUUID() + "." + safeExtension;

        const path = "uploads/" + filename;

        try {
          const { error } = await db.storage
            .from("photos")
            .upload(path, file, {
              contentType: file.type,
              upsert: false
            });

          if (error) {
            throw error;
          }

          success++;

        } catch (error) {
          failed++;

          const message =
            error.message || String(error);

          errors.push(file.name + ": " + message);

          console.error(
            "Supabase upload failed:",
            error
          );
        }

        progress.value =
          Math.round(((i + 1) / files.length) * 100);
      }

      if (failed === 0) {
        showStatus(
          "✅ Success! " + success +
          " picture(s) uploaded.",
          "success"
        );

        photos.value = "";
        preview.innerHTML = "";

      } else {
        showStatus(
          "Uploaded: " + success +
          "\nFailed: " + failed +
          "\n\nError details:\n" +
          errors.join("\n"),
          "error"
        );
      }

      button.disabled = false;
    }
  </script>

</body>
</html>
