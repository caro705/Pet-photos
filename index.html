
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pet Photos</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
      background: #f5f5f5;
    }

    h1 {
      text-align: center;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      margin-top: 5px;
    }

    button {
      margin-top: 20px;
      padding: 12px 20px;
      background: #4CAF50;
      color: white;
      border: none;
      cursor: pointer;
      font-size: 16px;
    }

    button:disabled {
      background: gray;
      cursor: not-allowed;
    }

    #preview {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 20px;
    }

    #preview img {
      width: 150px;
      height: 150px;
      object-fit: cover;
      border-radius: 8px;
    }

    #status {
      margin-top: 20px;
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

  <h1>Share Your Pet Photos!</h1>

  <form id="uploadForm">

    <label for="name">Your name</label>
    <input
      id="name"
      type="text"
      placeholder="Enter your name"
      maxlength="60"
    >

    <label for="petName">Your pet's name</label>
    <input
      id="petName"
      type="text"
      placeholder="Enter your pet's name"
      maxlength="60"
    >

    <label for="photos">Choose photos</label>
    <input
      id="photos"
      type="file"
      accept="image/*"
      multiple
      required
    >

    <div id="preview"></div>

    <button id="uploadButton" type="submit">
      Upload Photos
    </button>

  </form>

  <p id="status"></p>

  <script>
    // Supabase connection
    const SUPABASE_URL = "https://epznvuilyfkccmehywkv.supabase.co";

    // Paste your existing Supabase publishable/anon key here
    const SUPABASE_KEY = "sb_publishable_1s4sNZCewdc9z78Koxc42g_GIc_kM1c";

    const db = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    // Get elements from the page
    const form = document.getElementById("uploadForm");
    const nameInput = document.getElementById("name");
    const petNameInput = document.getElementById("petName");
    const photosInput = document.getElementById("photos");
    const uploadButton = document.getElementById("uploadButton");
    const preview = document.getElementById("preview");
    const status = document.getElementById("status");

    // Show photo previews
    photosInput.addEventListener("change", function () {
      preview.innerHTML = "";

      const files = photosInput.files;

      for (const file of files) {
        if (!file.type.startsWith("image/")) {
          continue;
        }

        const img = document.createElement("img");
        img.src = URL.createObjectURL(file);
        img.alt = "Photo preview";

        preview.appendChild(img);
      }

      status.textContent = "";
    });

    // Upload photos when the form is submitted
    form.addEventListener("submit", async function (event) {
      event.preventDefault();

      const files = photosInput.files;

      if (files.length === 0) {
        status.textContent = "Please select at least one photo.";
        return;
      }

      const uploaderName =
        nameInput.value.trim() || "Anonymous";

      const petName =
        petNameInput.value.trim() || "Unknown";

      uploadButton.disabled = true;
      status.textContent = "Starting upload...";

      try {
        for (let i = 0; i < files.length; i++) {
          const file = files[i];

          status.textContent =
            `Uploading photo ${i + 1} of ${files.length}...`;

          // Create a unique filename
          const fileExtension =
            file.name.split(".").pop();

          const uniqueFileName =
            crypto.randomUUID() + "." + fileExtension;

          const filePath =
            "uploads/" + uniqueFileName;

          // Upload photo to Supabase Storage
          const { error: uploadError } = await db.storage
            .from("photos")
            .upload(filePath, file, {
              contentType: file.type,
              upsert: false
            });

          if (uploadError) {
            throw new Error(
              "Photo upload failed: " + uploadError.message
            );
          }

          // Save photo information in the database
          const { error: databaseError } = await db
            .from("photo_uploads")
            .insert({
              file_path: filePath,
              original_filename: file.name,
              uploader_name: uploaderName,
              pet_name: petName
            });

          if (databaseError) {
            throw new Error(
              "Photo uploaded, but saving details failed: " +
              databaseError.message
            );
          }
        }

        status.textContent =
          "All photos uploaded successfully!";

        form.reset();
        preview.innerHTML = "";

      } catch (error) {
        console.error("Upload error:", error);

        status.textContent =
          "Something went wrong:\n" + error.message;

      } finally {
        uploadButton.disabled = false;
      }
    });
  </script>

</body>
</html>
