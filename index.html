
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pet Photos</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 30px 15px;
      background: #f3f4f9;
      font-family: Arial, sans-serif;
      color: #222;
    }

    .container {
      max-width: 920px;
      margin: 0 auto;
      padding: 70px 55px 45px;
      background: white;
      border-radius: 35px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.04);
    }

    header {
      text-align: center;
      margin-bottom: 48px;
    }

    h1 {
      font-size: 62px;
      margin: 0;
      font-weight: 700;
    }

    .subtitle {
      font-size: 30px;
      color: #666;
      margin-top: 30px;
    }

    label {
      display: block;
      font-size: 29px;
      font-weight: bold;
      margin: 30px 0 16px;
    }

    input[type="text"],
    input[type="file"] {
      width: 100%;
      padding: 24px;
      border: 2px solid #ddd;
      border-radius: 16px;
      font-size: 28px;
      background: white;
    }

    input[type="file"] {
      cursor: pointer;
    }

    input[type="file"]::file-selector-button {
      font-size: 25px;
      padding: 5px 12px;
      cursor: pointer;
    }

    #preview {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 20px;
    }

    #preview img {
      width: 150px;
      height: 150px;
      object-fit: cover;
      border-radius: 12px;
    }

    button {
      width: 100%;
      margin-top: 85px;
      padding: 30px;
      border: none;
      border-radius: 18px;
      background: #4365e8;
      color: white;
      font-size: 30px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    button:hover {
      background: #3454d4;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    .progress-container {
      width: 100%;
      height: 15px;
      background: #e5e5e5;
      border-radius: 10px;
      margin-top: 35px;
      overflow: hidden;
    }

    #progressBar {
      height: 100%;
      width: 0%;
      background: #4778ed;
      transition: width 0.3s;
    }

    #status {
      text-align: center;
      font-size: 25px;
      margin-top: 40px;
      white-space: pre-line;
      line-height: 1.5;
    }

    .success {
      color: #398044;
    }

    .error {
      color: #d32f2f;
    }

    .footer {
      text-align: center;
      font-size: 22px;
      color: #888;
      margin-top: 35px;
    }

    @media (max-width: 600px) {
      .container {
        padding: 35px 22px;
      }

      h1 {
        font-size: 38px;
      }

      .subtitle {
        font-size: 20px;
      }

      label {
        font-size: 21px;
      }

      input[type="text"],
      input[type="file"] {
        font-size: 18px;
        padding: 15px;
      }

      button {
        font-size: 21px;
        margin-top: 45px;
        padding: 22px;
      }

      #status {
        font-size: 19px;
      }

      .footer {
        font-size: 17px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <header>
      <h1>🐾 Pet Photos</h1>
      <div class="subtitle">
        Share your favorite pet pictures with us!
      </div>
    </header>

    <form id="uploadForm">

      <label for="name">Your name</label>
      <input
        type="text"
        id="name"
        placeholder="Enter your name"
        maxlength="60"
      >

      <label for="petName">Your pet's name</label>
      <input
        type="text"
        id="petName"
        placeholder="Enter your pet's name"
        maxlength="60"
      >

      <label for="photos">Choose pictures</label>
      <input
        type="file"
        id="photos"
        accept="image/*"
        multiple
        required
      >

      <div id="preview"></div>

      <button type="submit" id="uploadButton">
        📤 Upload Pictures
      </button>

    </form>

    <div class="progress-container">
      <div id="progressBar"></div>
    </div>

    <div id="status"></div>

    <div class="footer">
      Your pictures are uploaded securely.
    </div>

  </div>

  <script>
    // SUPABASE CONNECTION

    const SUPABASE_URL =
      "https://epznvuilyfkccmehywkv.supabase.co";

    // Paste your existing Supabase publishable key here
    const SUPABASE_KEY = "sb_publishable_1s4sNZCewdc9z78Koxc42g_GIc_kM1c";

    const db = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


    // GET HTML ELEMENTS

    const form = document.getElementById("uploadForm");
    const nameInput = document.getElementById("name");
    const petNameInput = document.getElementById("petName");
    const photosInput = document.getElementById("photos");
    const uploadButton = document.getElementById("uploadButton");
    const preview = document.getElementById("preview");
    const status = document.getElementById("status");
    const progressBar = document.getElementById("progressBar");


    // CLEAN NAMES FOR FOLDER AND FILE NAMES

    function cleanName(name) {
      return name
        .trim()
        .replace(/[^a-zA-Z0-9_-]/g, "_")
        .replace(/_+/g, "_");
    }


    // SHOW PHOTO PREVIEWS

    photosInput.addEventListener("change", function () {
      preview.innerHTML = "";

      for (const file of photosInput.files) {
        if (!file.type.startsWith("image/")) {
          continue;
        }

        const img = document.createElement("img");
        img.src = URL.createObjectURL(file);
        img.alt = "Pet photo preview";

        preview.appendChild(img);
      }

      status.textContent = "";
      status.className = "";
      progressBar.style.width = "0%";
    });


    // UPLOAD PHOTOS

    form.addEventListener("submit", async function (event) {
      event.preventDefault();

      const files = photosInput.files;

      if (files.length === 0) {
        status.textContent =
          "Please choose at least one picture.";
        status.className = "error";
        return;
      }

      const uploaderName =
        nameInput.value.trim() || "Anonymous";

      const petName =
        petNameInput.value.trim() || "Unknown";

      const safeUploader = cleanName(uploaderName);
      const safePet = cleanName(petName);

      const folderName =
        safeUploader + "_" + safePet;

      uploadButton.disabled = true;
      uploadButton.textContent = "⏳ Uploading...";

      status.textContent = "Starting upload...";
      status.className = "";

      progressBar.style.width = "0%";

      let uploadedCount = 0;
      const uploadedPaths = [];

      try {

        // GET EXISTING PHOTOS IN THE FOLDER

        const { data: existingPhotos, error: listError } =
          await db.storage
            .from("photos")
            .list(folderName, {
              limit: 1000,
              sortBy: {
                column: "name",
                order: "asc"
              }
            });

        if (listError) {
          throw new Error(
            "Could not list existing photos: " +
            listError.message
          );
        }

        // FIND HIGHEST EXISTING PHOTO NUMBER

        let highestNumber = 0;

        for (const photo of existingPhotos || []) {
          const match = photo.name.match(/_(\d+)\./);

          if (match) {
            highestNumber = Math.max(
              highestNumber,
              Number(match[1])
            );
          }
        }


        // UPLOAD EACH PHOTO

        for (let i = 0; i < files.length; i++) {

          const file = files[i];

          status.textContent =
            `Uploading picture ${i + 1} of ${files.length}...`;

          // Create next number: 001, 002, 003...
          highestNumber++;

          const photoNumber =
            String(highestNumber).padStart(3, "0");

          // Get file extension
          const fileExtension =
            file.name.split(".").pop().toLowerCase();

          // Create filename
          const uniqueFileName =
            safeUploader + "_" +
            safePet + "_" +
            photoNumber + "." +
            fileExtension;

          // Create full storage path
          const filePath =
            folderName + "/" + uniqueFileName;


          // UPLOAD TO SUPABASE STORAGE

          const { error: uploadError } = await db.storage
            .from("photos")
            .upload(filePath, file, {
              contentType: file.type,
              upsert: false
            });

          if (uploadError) {
            throw new Error(
              "Photo upload failed: " +
              uploadError.message
            );
          }


          // SAVE PHOTO INFORMATION IN DATABASE

          const { error: databaseError } = await db
            .from("photo_uploads")
            .insert({
              file_path: filePath,
              original_filename: file.name,
              uploader_name: uploaderName,
              pet_name: petName
            });

          if (databaseError) {
            throw new Error(
              "Photo uploaded, but database saving failed: " +
              databaseError.message
            );
          }

          uploadedPaths.push(filePath);
          uploadedCount++;

          // UPDATE PROGRESS BAR
          const percentage =
            (uploadedCount / files.length) * 100;

          progressBar.style.width =
            percentage + "%";
        }


        // SUCCESS MESSAGE

        status.className = "success";

        status.textContent =
          "✅ Success!\n\n" +
          uploadedCount +
          " picture(s) uploaded successfully.\n\n" +
          "Pictures named using:\n" +
          uploaderName + " + " + petName;

        form.reset();
        preview.innerHTML = "";


      } catch (error) {

        console.error("Upload error:", error);

        status.className = "error";

        status.textContent =
          "❌ Something went wrong:\n" +
          error.message +
          "\n\n" +
          uploadedCount +
          " picture(s) uploaded successfully before the error.";

      } finally {

        uploadButton.disabled = false;
        uploadButton.textContent = "📤 Upload Pictures";

      }

    });

  </script>

</body>
</html>
